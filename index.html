<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Vinyl Collector</title>
    <meta name="theme-color" content="#fff8ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vinyl" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <style>
      /* shown until the app has loaded (React replaces #root) */
      html, body { margin: 0; background: #fff8ef; }
      .loader-vinyl { animation: loader-spin 1.6s linear infinite; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.25)); }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash loader" id="boot-loader" style="min-height:100dvh;display:flex;align-items:center;justify-content:center">
        <svg class="loader-vinyl" viewBox="0 0 100 100" width="120" height="120" aria-hidden="true">
          <circle cx="50" cy="50" r="49" fill="#1d1b19" />
          <circle cx="50" cy="50" r="22" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.6" />
          <circle cx="50" cy="50" r="28" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.6" />
          <circle cx="50" cy="50" r="34" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.6" />
          <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.6" />
          <circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.6" />
          <path d="M50 50L12 18L22 9Z" fill="#fff" opacity="0.12" />
          <path d="M50 50L88 82L78 91Z" fill="#fff" opacity="0.08" />
          <circle cx="50" cy="50" r="17" fill="#d9565f" />
          <circle cx="50" cy="50" r="11" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="0.8" />
          <circle cx="50" cy="50" r="2.4" fill="#fff8ef" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
